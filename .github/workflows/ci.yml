name: CI

on: [push, workflow_dispatch]

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE_NAME: ${{ github.repository_owner }}/dripdrop-server
  CLIENT_IMAGE_NAME: ${{ github.repository_owner }}/dripdrop-ui

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            client:
              - 'client/**'
            server:
              - 'app/**'
              - 'tests/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'

  server-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Run linter
        run: make lint

  server-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Infisical
        uses: infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: e856a171-c913-4243-936d-942d86b7d4ea
          project-slug: dripdrop
          env-slug: dev
          export-type: "file"
      - name: Add default values to .env file
        run: |
          printf "\n" >> .env
          echo "ASYNC_DATABASE_URL=postgresql+asyncpg://dripdrop:dripdrop@postgres/dripdrop" >> .env
          echo "REDIS_URL=redis://redis:6379" >> .env
          echo "TEST_ASYNC_DATABASE_URL=postgresql+asyncpg://dripdrop:dripdrop@postgres/dripdrop" >> .env
          echo "TEST_REDIS_URL=redis://redis:6379" >> .env
      - name: Run tests
        run: docker compose --profile prod --env-file .env run --rm server test

  client-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Client Dependencies and build
        run: npm install --production=false && npm run build
        working-directory: client

  bump-version:
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    needs: [changes, server-lint, server-test, client-build]
    outputs:
      version: ${{ steps.cz.outputs.version }}
      previous_version: ${{ steps.cz.outputs.previous_version }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump version and generate changelog
        id: cz
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changelog_increment_filename: body.md
      - name: Create GitHub Release
        if: ${{ steps.cz.outputs.version != steps.cz.outputs.previous_version }}
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.cz.outputs.version }}
          name: ${{ steps.cz.outputs.version }}
          body_path: body.md

  deploy-server:
    if: ${{ github.ref_name == 'main' && needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    needs: [changes, bump-version]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.bump-version.outputs.version }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-client:
    if: ${{ github.ref_name == 'main' && needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    needs: [changes, bump-version]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Install Client Dependencies and build
        run: npm install --production=false && npm run build
        working-directory: client
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.bump-version.outputs.version }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: client
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
